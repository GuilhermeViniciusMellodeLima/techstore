
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Faça login na TechStore e acesse sua conta." />
  <title>Entrar — TechStore</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>

<body class="auth-page">

  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg__grid"></div>
    <div class="auth-bg__glow auth-bg__glow--1"></div>
    <div class="auth-bg__glow auth-bg__glow--2"></div>
  </div>

  <a href="/" class="auth-back" aria-label="Voltar para a loja">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    Voltar à loja
  </a>

  <main class="auth-main">
    <div class="auth-card" role="main">

      <a href="/" class="auth-logo" aria-label="TechStore - Ir para a página inicial">
        <span class="logo__icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="7" fill="#2563EB"/>
            <path d="M7 10h14M7 14h9M7 18h11" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="logo__text">Tech<strong>Store</strong></span>
      </a>

      <header class="auth-card__header">
        <h1 class="auth-card__title">Bem-vindo de volta</h1>
        <p class="auth-card__subtitle">Entre com sua conta para continuar</p>
      </header>

      <div class="auth-alert auth-alert--hidden" id="auth-alert" role="alert" aria-live="assertive"></div>

      <form class="auth-form" id="login-form" novalidate autocomplete="on">

        <div class="form-group" id="group-email">
          <label class="form-label" for="login-email">E-mail</label>

          <div class="form-input-wrap">
            <svg class="form-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2-2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>

            <input
              type="email"
              id="login-email"
              name="email"
              class="form-input"
              placeholder="seu@email.com"
              autocomplete="email"
              inputmode="email"
              required
              aria-required="true"
              aria-describedby="email-error"
            />
          </div>

          <span class="form-error" id="email-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group" id="group-senha">
          <label class="form-label" for="login-senha">Senha</label>

          <div class="form-input-wrap">
            <svg class="form-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>

            <input
              type="password"
              id="login-senha"
              name="senha"
              class="form-input form-input--password"
              placeholder="Sua senha"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="senha-error"
              minlength="8"
            />

            <button type="button" class="form-pwd-toggle" id="toggle-senha" aria-label="Mostrar senha" tabindex="0">
              <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>

              <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>

          <span class="form-error" id="senha-error" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--full btn--lg auth-submit" id="btn-login-submit">
          <span class="btn-label">Entrar</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

      </form>

      <div class="auth-divider" aria-hidden="true">
        <span>ou</span>
      </div>

      <p class="auth-switch">
        Não tem conta?
        <a href="/cadastro.html" class="auth-switch__link">Criar conta grátis</a>
      </p>

    </div>
  </main>

  <script src="/js/auth.js" defer></script>
  <script src="/js/login-init.js" defer></script>

</body>
</html>
